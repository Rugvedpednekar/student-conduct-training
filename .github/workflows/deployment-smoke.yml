name: Deployment smoke test

on:
  pull_request:
  push:
    branches:
      - main
      - chore/render-neon-secure-deployment

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check source syntax
        run: python -m compileall -q app scripts
      - name: Verify insecure/default configuration cannot start
        env:
          SECRET_KEY: short
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          try:
              with TestClient(app):
                  raise AssertionError("Insecure secret was accepted")
          except RuntimeError as exc:
              assert "SECRET_KEY" in str(exc), str(exc)
          PY
      - name: Verify secure app bootstraps and serves health/login
        env:
          SECRET_KEY: test-only-not-production-very-long-session-signing-key
          DATABASE_URL: sqlite:///./ci_smoke.db
          INITIAL_ADMIN_USERNAME: smokeadmin
          INITIAL_ADMIN_PASSWORD: sample-only-password-123456
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from sqlalchemy import select
          from app.main import app
          from app.database import SessionLocal
          from app.models import User
          with TestClient(app) as client:
              assert client.get("/healthz").json() == {"status": "ok"}
              assert client.get("/login").status_code == 200
              with SessionLocal() as db:
                  assert db.scalar(select(User).where(User.username == "smokeadmin")) is not None
                  assert db.scalar(select(User).where(User.username == "DAVE")) is None
          PY
